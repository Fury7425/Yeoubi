# SPDX-License-Identifier: Apache-2.0
# Build the native runtime on each OS and check it against PyTorch on tiny
# random checkpoints (scripts/make_parity_fixture.py). The executables plus
# the fixture GGUFs and reference logits are uploaded as artifacts, so a
# machine without torch can rerun the comparison on its own GPU.
name: runtime

on:
  push:
    paths:
      - "runtime/**"
      - "yeoubi/**"
      - "export.py"
      - "scripts/check_runtime_parity.py"
      - "scripts/make_parity_fixture.py"
      - ".github/workflows/runtime.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: -DGGML_VULKAN=ON
          - os: ubuntu-24.04
            flags: -DGGML_VULKAN=ON
          - os: macos-latest
            flags: -DGGML_METAL=ON
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VULKAN_VERSION: 1.4.313.2
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\vulkan.exe" -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\vulkan.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Vulkan SDK + lavapipe (Linux)
        if: runner.os == 'Linux'
        # mesa-vulkan-drivers brings lavapipe, a software Vulkan device, so the
        # Vulkan backend is actually executed here, not just compiled.
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc spirv-headers mesa-vulkan-drivers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python deps (CPU torch)
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build
        run: |
          # GGML_NATIVE=OFF: a native build targets the runner's CPU (AVX-512
          # Xeons) and dies with "illegal instruction" on most laptops.
          cmake -S runtime -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF ${{ matrix.flags }}
          cmake --build build --config Release -j 4

      - name: Parity fixtures
        run: |
          python scripts/make_parity_fixture.py --out fixture
          for m in rdt std moe; do
            python export.py --checkpoint fixture/$m.pt --output_dir fixture/$m --format gguf
            # The torch-free exporter must write the same file.
            python -m yeoubi.gguf_export fixture/$m.pt fixture/$m/numpy.gguf
            cmp fixture/$m/model.gguf fixture/$m/numpy.gguf
            for act in none a4 a8; do
              python scripts/check_runtime_parity.py --checkpoint fixture/$m.pt --act $act \
                --save-ref fixture/$m/ref_$act.npz
            done
            # Cached block path: multi-chunk prompt commit + one denoised block.
            python scripts/check_runtime_parity.py --checkpoint fixture/$m.pt --act a4 --block 8 \
              --save-ref fixture/$m/ref_block.npz
          done

      - name: Parity check
        run: |
          EXE=build/bin/yeoubi
          if [ -f build/bin/Release/yeoubi.exe ]; then EXE=build/bin/Release/yeoubi.exe; fi
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          "$EXE" --list-devices
          fail=0
          for m in rdt std moe; do
            for dev in $("$EXE" --list-devices | awk '{print $1}'); do
              for ref in none a4 a8 block; do
                echo "== $m on $dev"
                python scripts/check_runtime_parity.py --ref fixture/$m/ref_$ref.npz \
                  --gguf fixture/$m/model.gguf --runtime "$EXE" --device "$dev" 2>&1 \
                  | grep -vE '^ggml_(metal|vulkan)|^(device|wrote) ' || fail=1
              done
              # Every in-memory ternary format must repack the TQ1_0 file exactly.
              for wt in q4 tq2 tq1 f16; do
                echo "== $m on $dev as $wt"
                python scripts/check_runtime_parity.py --ref fixture/$m/ref_none.npz \
                  --gguf fixture/$m/model.gguf --runtime "$EXE" --device "$dev" --weight-type $wt 2>&1 \
                  | grep -vE '^ggml_(metal|vulkan)|^(device|wrote) ' || fail=1
              done
              # The argsort TopK fallback (devices without TOP_K_MASK) must hold too.
              for ref in a4 block; do
                echo "== $m on $dev, argsort TopK"
                YEOUBI_NO_FAST_TOPK=1 python scripts/check_runtime_parity.py --ref fixture/$m/ref_$ref.npz \
                  --gguf fixture/$m/model.gguf --runtime "$EXE" --device "$dev" 2>&1 \
                  | grep -vE '^ggml_(metal|vulkan)|^(device|wrote) ' || fail=1
              done
            done
          done
          exit $fail

      - name: Benchmark (step-25000 dimensions, random weights)
        run: |
          python scripts/make_parity_fixture.py --out bench --bench > /dev/null
          python -m yeoubi.gguf_export bench/bench.pt bench/bench.gguf
          med() { sort -n | awk '{a[NR]=$1} END {print a[int((NR+1)/2)]}'; }
          for dev in $("$EXE" --list-devices | awk '{print $1}'); do
            for n in 256 1024; do
              new=$("$EXE" -m bench/bench.gguf -d $dev -t 4 -n $n --steps 8 -v 2>&1 | grep -oE 'forward=[0-9.]+' | tail -6 | cut -d= -f2 | med)
              old=$(YEOUBI_NO_FUSED_QUANT=1 YEOUBI_NO_FAST_TOPK=1 YEOUBI_NO_FLASH_ATTN=1 "$EXE" -m bench/bench.gguf -d $dev -t 4 -n $n --steps 8 -v 2>&1 | grep -oE 'forward=[0-9.]+' | tail -6 | cut -d= -f2 | med)
              echo "BENCH $dev n=$n: stock-op path $old ms/step, fused kernels $new ms/step"
            done
          done

      - name: Fused kernels and flash attention off must still match
        run: |
          fail=0
          for m in rdt moe; do
            for ref in a4 a8 block; do
              YEOUBI_NO_FUSED_QUANT=1 YEOUBI_NO_FLASH_ATTN=1 python scripts/check_runtime_parity.py --ref fixture/$m/ref_$ref.npz \
                --gguf fixture/$m/model.gguf --runtime "$EXE" --device CPU 2>&1 | grep -E '^\[|FAIL' || fail=1
            done
          done
          exit $fail

      - name: Graph reuse gives identical samples
        run: |
          for args in "-m fixture/rdt/model.gguf -p Hello -n 64 --steps 6" \
                      "-m fixture/moe/model.gguf -p Hello -n 48 --block 16 --steps 4"; do
            "$EXE" $args -d CPU > reuse.txt
            YEOUBI_NO_GRAPH_REUSE=1 "$EXE" $args -d CPU > rebuild.txt
            cmp reuse.txt rebuild.txt
          done

      - name: Sample smoke run
        run: |
          "$EXE" -m fixture/rdt/model.gguf -p "Hello" -n 64 --steps 4 -v | od -c
          "$EXE" -m fixture/moe/model.gguf -p "Hello" -n 40 --block 16 --steps 4 --auto-length -v | od -c

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yeoubi-${{ runner.os }}
          path: |
            build/bin/
            fixture/*/model.gguf
            fixture/*/ref_*.npz
          if-no-files-found: warn
          retention-days: 7

  # OpenVINO build (Intel CPU / Arc GPU / Core Ultra NPU). A separate binary:
  # it links openvino.dll, so the OpenVINO runtime DLLs ship next to it and
  # nothing has to be installed on the target machine. Recipe and version
  # follow llama.cpp's build-openvino.yml / release.yml.
  openvino-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      OV_MAJOR: "2026.4.1"
      OV_FULL: "2026.4.1.22982.07f9c262b05"
      GGML_OPENVINO_DEVICE: CPU  # CI runners have no Intel GPU/NPU
    steps:
      - uses: actions/checkout@v4

      - name: OpenVINO toolkit + OpenCL
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://storage.openvinotoolkit.org/repositories/openvino/packages/$env:OV_MAJOR/windows/openvino_toolkit_windows_$($env:OV_FULL)_x86_64.zip" -OutFile ov.zip
          Expand-Archive ov.zip -DestinationPath openvino_toolkit
          $root = (Get-ChildItem openvino_toolkit -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$root\runtime\cmake\OpenVINOConfig.cmake")) { throw "OpenVINOConfig.cmake not found under $root" }
          Add-Content $env:GITHUB_ENV "OPENVINO_ROOT=$root"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencl:x64-windows

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python deps (CPU torch)
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build
        shell: cmd
        run: |
          call "%OPENVINO_ROOT%\setupvars.bat"
          cmake -S runtime -B build -G "Visual Studio 17 2022" -A x64 -DGGML_NATIVE=OFF -DGGML_OPENVINO=ON -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake || exit /b 1
          cmake --build build --config Release -- /m || exit /b 1

      - name: Bundle the OpenVINO runtime next to the exe
        shell: pwsh
        run: |
          $dest = "build\bin\Release"
          $ovBin = Join-Path $env:OPENVINO_ROOT 'runtime\bin\intel64\Release'
          Copy-Item (Join-Path $ovBin '*.dll') $dest -Force
          Copy-Item (Join-Path $ovBin 'cache.json') $dest -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:OPENVINO_ROOT 'runtime\3rdparty\tbb\bin\tbb*.dll') $dest -Force
          Copy-Item (Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows\bin\OpenCL.dll') $dest -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse (Join-Path $env:OPENVINO_ROOT 'docs\licensing') "$dest\openvino-licensing" -ErrorAction SilentlyContinue

      - name: Parity on every device (OpenVINO on its CPU plugin)
        run: |
          EXE=build/bin/Release/yeoubi.exe
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          "$EXE" --list-devices
          python scripts/make_parity_fixture.py --out fixture
          fail=0
          for m in rdt std moe; do
            python export.py --checkpoint fixture/$m.pt --output_dir fixture/$m --format gguf
            for act in none a4; do
              python scripts/check_runtime_parity.py --checkpoint fixture/$m.pt --act $act --save-ref fixture/$m/ref_$act.npz
            done
            python scripts/check_runtime_parity.py --checkpoint fixture/$m.pt --act a4 --block 8 --save-ref fixture/$m/ref_block.npz
            for dev in $("$EXE" --list-devices | awk '{print $1}'); do
              # Experimental: ggml's OpenVINO translator treats VIEW as a no-op
              # (llama.cpp graph conventions), which breaks the RDT/MoE graphs
              # and the KV-cached path. Only the flat full-canvas graph is held
              # to parity there; the rest is reported, not gated.
              for ref in none a4 block; do
                gate=1
                case "$dev" in OPENVINO*) [ "$m" = std ] && [ "$ref" != block ] || gate=0 ;; esac
                echo "== $m on $dev ($ref)$([ $gate = 0 ] && echo ', not gated')"
                python scripts/check_runtime_parity.py --ref fixture/$m/ref_$ref.npz \
                  --gguf fixture/$m/model.gguf --runtime "$EXE" --device "$dev" 2>&1 \
                  | grep -E '^\[|FAIL|^topk|rror' || [ $gate = 0 ] || fail=1
              done
            done
          done
          exit $fail

      - name: Benchmark (step-25000 dimensions, random weights)
        run: |
          python scripts/make_parity_fixture.py --out bench --bench > /dev/null
          python -m yeoubi.gguf_export bench/bench.pt bench/bench.gguf
          med() { sort -n | awk '{a[NR]=$1} END {print a[int((NR+1)/2)]}'; }
          for dev in $("$EXE" --list-devices | awk '{print $1}'); do
            # RDT model: fails on OpenVINO (see the parity step), so not gated here.
            t=$("$EXE" -m bench/bench.gguf -d $dev -t 4 -n 256 --steps 8 -v 2>&1 | grep -oE 'forward=[0-9.]+' | tail -6 | cut -d= -f2 | med || true)
            echo "BENCH $dev n=256: ${t:-failed} ms/step"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yeoubi-Windows-OpenVINO
          path: build/bin/Release/
          if-no-files-found: warn
          retention-days: 7
